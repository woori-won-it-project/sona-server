# RabbitMQ/Redis를 쓰는 테스트가 생기면 backend job의 services에 추가
name: CI

# 경로 필터 없음: backend, scripts 는 ruleset 필수 체크라 모든 PR에서 실행되어야 한다
on:
  pull_request:
    branches: [dev, main]

# 같은 PR에 새 커밋이 올라오면 이전 실행 취소
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        # 테스트 전용 값 (실제 비밀번호 아님)
        env:
          POSTGRES_DB: sona_test
          POSTGRES_USER: sona_test
          POSTGRES_PASSWORD: sona_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sona_test -d sona_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: sona_test
      PGUSER: sona_test
      PGPASSWORD: sona_test
      TEST_DB_URL: jdbc:postgresql://localhost:5432/sona_test
      TEST_DB_USER: sona_test
      TEST_DB_PASSWORD: sona_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Apply schema (infra/init.sql)
        run: psql -v ON_ERROR_STOP=1 -f infra/init.sql

      - name: Build and test
        working-directory: api-spring
        run: ./gradlew build --no-daemon

  scripts:
    name: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Syntax check (py_compile)
        # 기본 pathspec 에서 * 는 하위 폴더까지 매칭
        run: |
          git ls-files 'scripts/*.py'
          git ls-files -z 'scripts/*.py' | xargs -0 -r python -m py_compile
