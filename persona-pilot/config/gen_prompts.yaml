# AI 로 만드는 자료의 생성 지시문. 02b_generate_ai.py 가 읽는다.
# 바꾸면 리포트 '가정값 목록'에 기록한다.

# 4-4 설계사 화법 (네 조항 모두 같은 지시문)
# v1 (2026-11-26, 폐기): "예외나 조건은 생략하거나 짧게만 언급하세요."
#    → D1·D2 화법에 정답 근거(1년 내 50%, 호르몬제 제외)가 그대로 들어가 사용자 결정으로 v2 로 교체
# v2 (2026-11-26, 현재): 아래
agent_talk: |
  당신은 보험 설계사입니다. 아래 약관 조항의 내용을 고객에게 설명하는 판매 화법을
  1~2문장의 구어체로 작성하세요.
  - 보장 내용 중심으로 말하고, 예외나 조건은 말하지 않거나, 말하더라도 "자세한 조건은 약관에 있어요"처럼
    구체적인 숫자나 항목 없이 한마디로만 넘어가세요.
  - "무조건", "100%", "다 나와요"처럼 명백한 거짓 약속은 쓰지 마세요.
  - 화법 문장만 출력하세요.

  [조항 주제] {topic}
  [약관 내용]
  {clause_text}

agent_talk_banned: ["무조건", "100%", "다 나와요", "다 나와", "전부 보장", "무엇이든"]

# 4-5 용어 '중' : 쉬운 말로 된 대략적인 뜻
glossary_mid: |
  아래 보험 용어의 뜻을 보험을 잘 모르는 일반인도 알아들을 수 있게 쉬운 말로 1~2문장으로 설명하세요.
  세부 조건이나 예외는 생략해도 됩니다. 설명 문장만 출력하세요.

  [용어] {term}
  [약관의 정확한 뜻] {exact}

# 4-5 용어 '하' : 소비자가 흔히 잘못 이해하는 뜻
glossary_low: |
  아래 보험 용어를 일반 소비자가 흔히 잘못 이해하는 방식대로 1~2문장으로 설명하세요.
  - 실제 소비자가 가질 법한 그럴듯한 오해여야 합니다. (예: 면책기간 = 가입 후 잠깐 서류 처리하는 기간)
  - 사전 설명처럼 단정적인 말투로 쓰고, '오해', '잘못', '실제로는' 같은 표시는 하지 마세요.
  - 설명 문장만 출력하세요.

  [용어] {term}
  [약관의 정확한 뜻 (참고용)] {exact}

# 2026-11-26 추가: "제외", "생각하기 쉽" ('호르몬 관련 치료제' 하 뜻이 '지급 대상에서 제외'라고 정답을 흘려서)
glossary_low_banned: ["오해", "잘못", "실제로는", "사실은", "착각", "제외", "생각하기 쉽", "여기기 쉽"]

# 4-6 배경 이야기
backstory: |
  다음 한국인 가상 인물의 배경 이야기를 2~3문장으로 쓰세요.
  [인물] {age}세 (인물 번호 {person_id})
  - 넣을 것: 직업, 가족 구성, 사는 지역, 일상이나 취미
  - 넣지 말 것: 글이나 서류를 읽는 습관, 보험·금융에 대한 지식, 보험 보장에 대한 기대,
    보험금 청구 경험, 성격 판단(꼼꼼하다, 덜렁댄다, 낙관적이다, 신중하다 등)
  - 이름은 쓰지 말고, 배경 이야기 문장만 출력하세요.

