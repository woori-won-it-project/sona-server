# 연령대별 용어 이해 단계(상·중·하) 비율 — 보험 전용 자료 우선 원칙 (2026-11-27 사용자 결정)
# 출처: 보험연구원 『2019년 보험소비자 설문조사』 (n=2,464, 60대는 '60대 이상')
#   상 = 본인 보험이해력이 '높다'(매우+대체로 높다), 하 = 가입 보험의 보장내용을 '모른다'(대체로+전혀), 중 = 나머지
# 있으면 아래 bands 의 knowledge 비율 대신 이 값을 쓴다. 근거 설명: EVIDENCE.md 8절
knowledge_by_age:
  20대: {상: 0.088, 중: 0.389, 하: 0.523}
  40대: {상: 0.136, 중: 0.533, 하: 0.331}
  60대: {상: 0.023, 중: 0.351, 하: 0.626}

# 연령대별 꼼꼼함 평균 — 보험 전용 행동 자료 (2026-11-27 사용자 결정, 후보 B)
# 출처: 보험연구원 『2019년 보험소비자 설문조사』 '가입 전 납입기간·보장기간 정보를 찾아본 적 있다' 응답률
#   전체 54.5% / 20대 46.9 / 40대 59.3 / 60대 이상 45.6
# 계산: 기본값 0.55 × (연령대 응답률 ÷ 전체 54.5%). 범위는 bands 의 diligence_range(±0.15) 그대로.
# 이전 값(종합 금융이해력 점수 구간): 20대 0.45 / 40대 0.65 / 60대 0.55. 변경 이유: EVIDENCE.md 8-4
diligence_base: 0.55
diligence_by_age:
  20대: 0.473   # 0.55 × 46.9 / 54.5
  40대: 0.598   # 0.55 × 59.3 / 54.5
  60대: 0.460   # 0.55 × 45.6 / 54.5

# 점수 구간 → 꼼꼼함·지식 비율 (모두 가정값). 위에서부터 min 이상이면 그 구간
bands:
  - name: 높음
    min: 68
    diligence_mean: 0.65
    diligence_range: 0.15
    knowledge: {상: 0.30, 중: 0.45, 하: 0.25}
  - name: 보통
    min: 63
    diligence_mean: 0.55
    diligence_range: 0.15
    knowledge: {상: 0.20, 중: 0.45, 하: 0.35}
  - name: 낮음
    min: 0
    diligence_mean: 0.45
    diligence_range: 0.15
    knowledge: {상: 0.15, 중: 0.35, 하: 0.50}
