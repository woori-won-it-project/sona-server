# 실행 설정. 바꾸면 리포트의 '가정값 목록'에 함께 기록된다.
# API 키는 여기에 쓰지 않는다. 환경 변수 ANTHROPIC_API_KEY 로만 읽는다.
model: claude-haiku-5-5        # 응답·배경 이야기·설계사 화법·용어 뜻 모두 같은 모델
# 2026-11-28: Claude 크레딧 소진으로 OpenAI 로 전환. .env 의 LLM_PROVIDER=openai 이면 아래 모델을 쓴다
openai_model: gpt-6-luna
# temperature: 명세서는 0 이지만 Haiku 5.5 는 temperature 값을 보내면 400 오류 → 보내지 않음 (기본값 사용)
thinking: disabled              # disabled | adaptive. Haiku 5.5 는 기본이 생각 켜짐. 끄면 읽은 글로 바로 답함
effort: low                     # low | medium | high (thinking: disabled 는 high 이하에서만 가능)
max_tokens: 1024
repeats: 1                      # 명세서는 3회. 사용자 결정으로 1회 (2026-11-26)
json_retry: 2                   # JSON 형식이 아니면 최대 2회 재요청
# 1차 실행(2026-11-26)에서 '판단 불가'가 18%(설계사 Q4 는 100%)로 많아 정답·오답 비교가 어려웠음
# → 사용자 결정으로 답을 예/아니요 둘 중 하나로만 받는다 (명세서: 예/아니요/판단 불가)
allow_undetermined: false

age_groups: ["20대", "40대", "60대"]
people_per_path: 4              # assignment: quota 일 때만 사용 (A안·C안 v1·v2)
# 배정 방식 (2026-11-27 사용자 결정): balanced = 연령대 × 경로 × 용어 이해 단계(상·중·하) 칸마다 같은 인원,
#   성향은 칸 안에서 반반. 전체 점수는 실제 비율(경로 가중치·연령대별 상중하 비율·연령대 구성비)로 가중해서 낸다.
#   이전(quota): 연령대마다 실제 상중하 비율대로 16명 배정 → '상'이 4명뿐이라 비교 불가했음
assignment: balanced
people_per_cell: 2              # 칸마다 2명 (낙관 1 · 신중 1) → 3 × 4 × 3 × 2 = 72명

# 정보 경로 (순서 고정). weight 는 최종 오해율 가중치 — 가정값 (근거 없음, EVIDENCE.md 8-2)
# 2026-11-27 변경: 5/20/35/40 → 5/15/30/50 (설계사 의존이 크다는 방향만 여러 자료가 일치, 전 연령 같은 비율)
paths:
  - {id: full_terms,   name: "약관 정독",     weight: 0.05}
  - {id: clause_only,  name: "해당 조항만",   weight: 0.15}
  - {id: guide_only,   name: "설명서만",      weight: 0.30}
  - {id: agent_talk,   name: "설계사 말만",   weight: 0.50}

dispositions:
  optimistic: "애매한 부분이 있으면 보장되는 쪽으로 받아들이는 편입니다."
  cautious:   "애매한 부분이 있으면 보장되지 않을 수도 있다고 생각하는 편입니다."
